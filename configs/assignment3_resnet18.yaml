dataset:
  name: VinaFood21
  root: data/VinaFood21
  image_size: 224
  num_classes: auto

model:
  name: resnet18
  between_stages_pool:
    kernel_size: 3
    stride: 2
    padding: 0

training:
  epochs: 10
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  seed: 42
  selection_metric: f1_macro

output:
  checkpoint_dir: checkpoints/assignment3
  metrics_file: results/assignment3_metrics.csv
